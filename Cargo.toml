[package]
name = "universal_downloader_rust"
version = "4.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
flate2 = "1"
rfd = "0.15"
arboard = "3"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
flate2 = "1"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
